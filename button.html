<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .btn-8 {
  background-color: #01173D;
  color: #ffffff;
  background-image: linear-gradient(180deg, #01173D 0%, #99a2b1 60%, #01173D);
  height: 40px;
  width: 150px;
  border-radius: 10px;
  text-align: center;
  padding: 0;
  border: 2px solid transparent; /* important */
  font-size: 20px;
  position: relative;
  transition: all 0.4s ease;
}

.btn-8 span {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  text-align: center;
  padding: 6px;
  z-index: 1;
}


.btn-8:hover {
  background: rgba(1, 23, 61, 0.1); 
  border: 2px solid #f8d929;
  backdrop-filter: blur(4px); 
}


.btn-8:hover span {
  color: #0e203f;
}

/* Optional: smooth glow */
.btn-8:hover {
  box-shadow: 0 0 10px rgba(1, 23, 61, 0.3);
}

/*btn-1*/
.btn-1 {
  background-color: #FFE19E;
  background-image: linear-gradient(180deg, #FFE19E 0%, #c49e4d 60%, #FFE19E);
  height: 40px;
  width: 150px;
  border-radius: 10px;
  text-align: center;
  padding: 0px;
  border: 2px solid transparent; 
  font-size: 20px;
  position: relative;
  transition: all 0.4s ease;
   
}

.btn-1 span {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  padding: 6px;
  z-index: 1;
}


.btn-1:hover {
  background: #FFE19E; 
  border: 2px solid #d4a641; 
  backdrop-filter: blur(6px); 
 
}


.btn-1:hover span {
  color: #000000;
}


.btn-1:hover {
  box-shadow: 0 0 20px #FFE19E;
}
   
/*Button 2*/
.btn-2 {
  position: relative;
  border: none;
  padding: 12px 30px;
  font-size: 18px;
  border-radius: 8px;
  cursor: pointer;
  color: #fff;
  overflow: hidden;

  background: linear-gradient(180deg, #01173D 0%, #2a3f6a 60%, #01173D);

  /* stronger glow */
  box-shadow:
    0 0 10px rgba(1, 23, 61, 0.6),
    0 0 25px rgba(1, 23, 61, 0.4);

  transition: all 0.3s ease;
}

/* smooth shine sweep */
.btn-2::before {
  content: '';
  position: absolute;
  top: 0;
  left: -60px;
  width: 40px;
  height: 100%;
  background: rgba(255, 255, 255, 0.3);
  transform: skewX(-25deg);
  animation: shineMove 3s linear infinite;
}

/* hover effect */
.btn-2:hover {
  transform: translateY(-3px) scale(1.03);
  box-shadow:
    0 0 20px rgba(1, 23, 61, 0.8),
    0 0 40px rgba(1, 23, 61, 0.6);
}

/* active click feel */
.btn-2:active {
  transform: scale(0.96);
}

/* shine animation */
@keyframes shineMove {
  0% {
    left: -60px;
  }
  100% {
    left: 120%;
  }
}

/* Button 4*/

.btn-4 {
  position: relative;
  border: none;
  padding: 12px 30px;
  font-size: 18px;
  border-radius: 8px;
  cursor: pointer;
  color:#000000;
  overflow: hidden;

  background: linear-gradient(180deg,  #FFE19E 0%, #c49e4d 60%, #FFE19E);

  /* stronger glow */
  box-shadow:
    0 0 10px rgb(255, 225, 158,0.3),  
    0 0 25px rgb(196, 158, 77,0.3);
  transition: all 0.3s ease;
}
.btn-4 span {
  position: relative;
  z-index: 1;
}
/* smooth shine sweep */
.btn-4::before {
  content: '';
  position: absolute;
  top: 0;
  left: -60px;
  width: 40px;
  height: 100%;
  background:#FFE19E;
  transform: skewX(-25deg);
  animation: shineMove 3s linear infinite;
  z-index: 0;
}

/* hover effect */
.btn-4:hover {
    color:#000000;
  transform: translateY(-3px) scale(1.03);
  box-shadow:
    0 0 20px #FFE19E,
    0 0 40px #c49e4d;
}

/* active click feel */
.btn-4:active {
  transform: scale(0.96);
}

/* shine animation */
@keyframes shineMove {
  0% {
    left: -60px;
  }
  100% {
    left: 120%;
  }
}

    </style>
</head>
<body>
    <button class="btn-8"><span>Read More</span></button>
        <button class="btn-1"><span>Read More</span></button>
        <button class="btn-2"><span>Know More</span></button>
         <button class="btn-3"><span>Know More</span></button>
        <button class="btn-4"><span>Know More</span></button>
</body>
</html>
