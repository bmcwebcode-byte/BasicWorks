<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Switch Form</title>

<style>


body{
    font-size: 20px;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;

    background: linear-gradient(135deg, #2c2c2c, #4a4a4a);
}


#container{
    background: rgba(255, 255, 255, 0.08);
    height:200px;
    width:500px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}


.formdiv{
    background: rgba(255, 255, 255, 0.05);
    height:80px;
    width:220px;
    padding-bottom:100px;
    padding-left: 40px;
    backdrop-filter: blur(10px);
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.4s ease;
}

/*  Hide animation */
.hidden {
  opacity: 0;
  transform: translateY(20px) scale(0.95);
  pointer-events: none;
}

/* Smooth form transition */
#myForm{
  transition: all 0.4s ease;
}

/*  Liquid Neumorphic Switch */
#displaybtn {
  position: relative;
  width: 140px;
  height: 50px;
  border-radius: 50px;
  border: none;
  cursor: pointer;
  outline: none;
  font-size: 16px;
  font-weight: bold;

  background: #d1d1d1;
  color: #000;

  box-shadow: 
    inset 2px 2px 5px rgba(0,0,0,0.2),
    inset -2px -2px 5px rgba(255,255,255,0.7),
    3px 3px 8px rgba(0,0,0,0.2),
    -3px -3px 8px rgba(255,255,255,0.7);

  transition: all 0.4s ease;
  overflow: hidden;
}

/* Sliding capsule */
#displaybtn::before {
  content: "OFF";
  position: absolute;
  width: 65px;
  height: 42px;
  border-radius: 40px;
  top: 4px;
  left: 5px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: linear-gradient(145deg, #ffffff, #cfcfcf);
  color: #000;

  box-shadow: 
    2px 2px 6px rgba(0,0,0,0.3),
    -2px -2px 6px rgba(255,255,255,0.8);

  transition: all 0.4s ease;
}

/* 🟢 ON state (no text for clean look) */
#displaybtn.active::before {
  transform: translateX(65px);
  content: "ON";
  background: linear-gradient(145deg, #eafff5, #00df82);
}

/* Press feel */
#displaybtn:active::before {
  transform: scale(0.95) translateX(0);
}

#displaybtn.active:active::before {
  transform: scale(0.95) translateX(65px);
}

/*  Inputs */
input {
  margin: 5px 0;
  padding: 6px;
  border-radius: 8px;
  border: none;
  outline: none;
}

/* 🚀 Submit button */
input[type="submit"]{
  background: #00df82;
  color: black;
  cursor: pointer;
  transition: 0.3s;
}

input[type="submit"]:hover{
  transform: scale(1.05);
  box-shadow: 0 0 10px rgba(0,223,130,0.6);
}

</style>
</head>

<body>

<div id="container">
    <button id="displaybtn"></button>

    <div id="formdiv">
        <form id="myForm">
            <br>
            Name: <input type="text" placeholder="Enter Name">
            <br>
            Mobile: <input type="tel" placeholder="Enter Mobile Number">
            <br>
            <input type="submit" value="Submit">
        </form>
    </div>
</div>

<script>

let button = document.getElementById("displaybtn");
let form = document.getElementById("myForm");
let formDiv = document.querySelector("formdiv");

button.addEventListener("click", () => {
  button.classList.toggle("active");
  form.classList.toggle("hidden");
  formDiv.classList.toggle("hidden");
});

</script>

</body>
</html>
