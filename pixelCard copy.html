<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
   * {
  box-sizing: border-box;
}

body {
  background: #000;
  font-family: 'Segoe UI', sans-serif;
}

/* CARD */
.card {
  width: 420px;
  padding: 24px;
  border-radius: 18px;
  background: linear-gradient(145deg, #3a3a3a, #2e2e2e);
  color: #dcdcdc;
  display: flex;
  gap: 16px;
  align-items: flex-start;
  position: relative;
  overflow: hidden;

  /* IMPORTANT: no scaling */
  transition: box-shadow 0.3s ease, transform 0.3s ease;
}

/* LEFT GLOW STRIP */
.card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 6px;
  background: linear-gradient(#00ffae, #00d084);
  border-radius: 18px 0 0 18px;
}

/* ICON */
.icon {
  font-size: 28px;
  color: #00ffae;
  flex-shrink: 0;
}

/* TEXT */
.card h3 {
  margin: 0;
  font-size: 20px;
  font-weight: 600;
  color: #00ffae;
}

.card p {
  margin-top: 8px;
  font-size: 15px;
  line-height: 1.5;
  color: #cfcfcf;
}

/* 🔥 HOVER EFFECT (NO SIZE CHANGE) */
.card:hover {
  /* NO scale, NO padding change, NO font change */
  transform: translateY(-2px); /* tiny lift, no layout shift */
  box-shadow: 0 10px 30px rgba(0, 255, 174, 0.15);
}

/* Optional glow intensify */
.card:hover::before {
  background: linear-gradient(#00ffcc, #00ffa6);
}
    </style>
   
</head>
<body>
    <div class="card">
  <div class="icon">
    🔍
  </div>
  <div class="content">
    <h3>Clarity over complexity</h3>
    <p>
      We simplify processes, communication, and design to make digital
      solutions easy to understand and effective to use.
    </p>
  </div>
</div>
</div>
</body>
</html>
