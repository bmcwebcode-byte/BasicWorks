<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <style>
        body{
            background-color: black;
        }
        .rotate-y{
    width: 200px;
  animation: spinY 2s linear infinite;
  transform-style: preserve-3d;
  

}
@keyframes spinY {
  from {
    transform: perspective(600px) rotateY(0deg);
  }
  to {
    transform: perspective(600px) rotateY(360deg);
  }
}
/* container gives perspective (depth) */
.coin {
  width: 250px;
  height: 250px;
  perspective: 1000px;
  margin: 100px auto;
}

/* inner rotating part */
.coin-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  animation: flipCoin 5s linear infinite;
}

/* both faces */
.coin-face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden; /* hides mirror text */
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
}

/* FRONT */
.coin-face.front img {
  width: 80px;
  height: 100%;
  object-fit: contain;
  border-radius: 10px;
}

/* BACK */
.coin-face.back {
    
  /* background:#c9a24a; */
  color: #ffffff; /* gold tone */
  transform: rotateY(180deg);
  text-align: center;
  font-family: "Times New Roman", serif;
}

/* TEXT styling */
.coin-text span {
  display: block;
  width: 170px;
  font-size: 14px;
}

.line1 {
  font-size: 18px;
}

.line2 {
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 1px;
}

.line3 {
  font-size: 18px;
}

/* ANIMATION */
@keyframes flipCoin {
  0% {
    transform: rotateY(0deg);
  }
  100% {
    transform: rotateY(360deg);
  }
}
    </style>
<img src="./Aurum/AURAM_Images/AURUM_Logo.png" class="rotate-y" alt="rotating image">


<div class="coin">
  <div class="coin-inner">

    <!-- FRONT (Logo) -->
    <div class="coin-face front">
      <img src="/Aurum/AURAM_Images/AURUM_Logo.png" alt="logo" width="40px">
    </div>

    <!-- BACK (Text) -->
    <div class="coin-face back">
      <div class="coin-text">
        <span class="line1">By</span>
        <span class="line2">SREE VARAHA</span>
        <span class="line3">Group</span>
      </div>
    </div>

  </div>
</div>
</body>
</html>
