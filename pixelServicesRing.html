  function resize() {
    const S = Math.min(window.innerWidth, window.innerHeight, 760);
    canvas.width  = S;
    canvas.height = S;
  }
  resize();
  window.addEventListener('resize', resize);

  const SHIMMER_DURATION = 2000;
  const STAGGER          = 380;
  const startTime        = performance.now();

  /*
    Text on the TOP arc (angle near -PI/2 = 270deg):
      rotate = angle + PI/2   → text reads normally outward

    Text on the BOTTOM arc (angle near PI/2 = 90deg):
      If we just use rotate = angle + PI/2 → text is UPSIDE DOWN
      Fix: place text on TOP arc instead, using negative angles (upper half),
           so the curvature is correct and text reads left→right naturally.

    Strategy: put all labels on the UPPER arc (top half of circle),
    centred at -PI/2 (straight top). This way:
      - Text curves naturally along the top
      - No upside-down issue
      - Rotation = drawAt - PI/2 keeps each char upright
  */

  function drawCurvedLabel(text, ringR, shimmerT, sc) {
    const S  = canvas.width;
    const cx = S / 2, cy = S / 2;

    // Place label on TOP arc, just outside ring
    const r  = (ringR + 16) * sc;
    // const fs = Math.max(8, 11 * sc);
    

    ctx.save();
    ctx.font = `600 ${fs.toFixed(1)}px -apple-system,"Segoe UI",sans-serif`;

    const chars      = text.split('');
    const widths     = chars.map(ch => ctx.measureText(ch).width);
    const totalW     = widths.reduce((a, b) => a + b, 0);
    const totalAngle = totalW / r;

    // Centre text at top of circle: -PI/2
    const centre    = -Math.PI / 2;
    let   angleCursor = centre - totalAngle / 2;

    // shimmer beam angle position
    const beamAngle  = centre - totalAngle / 2 + totalAngle * shimmerT;
    const beamWidth  = totalAngle * 0.22;

    chars.forEach((ch, i) => {
      const cw     = widths[i];
      const cAngle = cw / r;
      const drawAt = angleCursor + cAngle / 2;

      const x = cx + r * Math.cos(drawAt);
      const y = cy + r * Math.sin(drawAt);

      const dist        = Math.abs(drawAt - beamAngle);
      const inBeam      = Math.max(0, 1 - dist / beamWidth);
      const shimmerGlow = inBeam * inBeam;

      ctx.save();
      ctx.translate(x, y);
      // TOP arc: rotate so text baseline faces outward
      ctx.rotate(drawAt + Math.PI / 2);
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha  = 1;

      ctx.shadowColor = `rgba(74,255,130,${shimmerGlow * 0.9})`;
      ctx.shadowBlur  = 18 * shimmerGlow;

      if (shimmerGlow > 0.01) {
        const rb = Math.round(255 * (1 - shimmerGlow * 0.65));
        ctx.fillStyle = `rgb(${rb},255,${rb})`;
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
      }

      ctx.fillText(ch, 0, 0);
      ctx.restore();

      angleCursor += cAngle;
    });

    ctx.restore();
  }

  function drawShimmerDot(ringR, shimmerT, sc) {
    if (shimmerT < -0.05 || shimmerT > 1.05) return;

    const S  = canvas.width;
    const cx = S / 2, cy = S / 2;
    const r  = (ringR + 16) * sc;
    const fs = Math.max(8, 11 * sc);

    ctx.font = `600 ${fs.toFixed(1)}px -apple-system,"Segoe UI",sans-serif`;
    const label    = RINGS.find(rg => rg.r === ringR).label;
    const totalW   = label.split('').reduce((a, ch) => a + ctx.measureText(ch).width, 0);
    const totalAngle = totalW / r;
    const centre   = -Math.PI / 2;
    const dotAngle = centre - totalAngle / 2 + totalAngle * shimmerT;

    const x  = cx + r * Math.cos(dotAngle);
    const y  = cy + r * Math.sin(dotAngle);
    const dr = 4.5 * sc;
    const gr = dr * 4;

    const g = ctx.createRadialGradient(x, y, 0, x, y, gr);
    g.addColorStop(0, 'rgba(74,255,130,0.9)');
    g.addColorStop(1, 'rgba(74,255,130,0)');

    ctx.save();
    ctx.fillStyle   = g;
    ctx.beginPath(); ctx.arc(x, y, gr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle   = '#4aff82';
    ctx.shadowColor = '#4aff82';
    ctx.shadowBlur  = 22;
    ctx.beginPath(); ctx.arc(x, y, dr, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function glowDot(x, y, r) {
    const gr = r * 3.5;
    const g  = ctx.createRadialGradient(x, y, 0, x, y, gr);
    g.addColorStop(0, 'rgba(74,255,130,0.5)');
    g.addColorStop(1, 'rgba(74,255,130,0)');
    ctx.save();
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, gr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle   = '#4aff82';
    ctx.shadowColor = '#4aff82';
    ctx.shadowBlur  = 18;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function draw(now) {
    const S     = canvas.width;
    const cx    = S / 2, cy = S / 2;
    const sc    = S / 760;
    const DOT_R = 5.5 * sc;

    ctx.clearRect(0, 0, S, S);

    /* Rings */
    RINGS.forEach(ring => {
      ctx.beginPath();
      ctx.arc(cx, cy, ring.r * sc, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.72)';
      ctx.lineWidth   = 1;
      ctx.stroke();
    });

    /* Logo */
    if (logo.complete && logo.naturalWidth > 0) {
      const logoW = RINGS[0].r * sc * 1.7;
      const logoH = logoW / (logo.naturalWidth / logo.naturalHeight);
      ctx.drawImage(logo, cx - logoW / 2, cy - logoH / 2, logoW, logoH);
    }

    /* Labels + shimmer */
    const elapsed      = now - startTime;
    const cycleDuration = SHIMMER_DURATION + STAGGER * RINGS.length;

    RINGS.forEach((ring, i) => {
      const offset   = i * STAGGER;
      const t        = ((elapsed - offset) % cycleDuration + cycleDuration) % cycleDuration;
      const shimmerT = (t / SHIMMER_DURATION) - 0.05;

      drawCurvedLabel(ring.label, ring.r, shimmerT, sc);
      drawShimmerDot(ring.r, shimmerT, sc);
    });

    /* Orbital dots */
    DOTS.forEach(dot => {
      dot.a += dot.spd;
      const r = RINGS[dot.ri].r * sc;
      glowDot(cx + r * Math.cos(dot.a), cy + r * Math.sin(dot.a), DOT_R);
    });

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
</script>
